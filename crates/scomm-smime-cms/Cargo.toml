[package]
name = "scomm-smime-cms"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CMS/X.509 backend for scomm-smime-core. Classical RSA/X25519 plus PQC hybrid."

[dependencies]
scomm-smime-core.workspace = true
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
ml-kem = { version = "0.3.2", features = ["getrandom"] }
ml-dsa = { version = "0.1.1", features = ["rand_core"] }
num-bigint = "0.4"
pem = "3"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser = "0.16"
yasna = "0.5"
