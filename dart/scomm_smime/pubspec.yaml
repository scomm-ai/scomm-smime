name: scomm_smime
description: Flutter FFI for the Scomm S/MIME SDK (CMS engine is an implementation detail).
version: 0.1.0
publish_to: none
homepage: https://github.com/scomm-ai/scomm-smime
repository: https://github.com/scomm-ai/scomm-smime

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
